name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, tests, e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dagda
          POSTGRES_PASSWORD: dagda
          POSTGRES_DB: dagda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dagda -d dagda"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DAGDA_REQUIRE_DB: "1"
      DAGDA_TEST_DB_URL: postgresql://dagda:dagda@localhost:5432/dagda

    steps:
      # SAN et Dagda doivent être des répertoires frères (file:../dagda/packages/*).
      - name: Checkout SAN
        uses: actions/checkout@v4
        with:
          path: SAN

      - name: Lire la ref de Dagda (DAGDA_REF)
        id: dagda-ref
        run: echo "ref=$(tr -d '[:space:]' < SAN/DAGDA_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout Dagda
        uses: actions/checkout@v4
        with:
          repository: ItHasU/dagda
          ref: ${{ steps.dagda-ref.outputs.ref }}
          path: dagda

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            SAN/package-lock.json
            dagda/package-lock.json

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Installer Dagda
        working-directory: dagda
        run: npm ci

      - name: Installer SAN
        working-directory: SAN
        run: npm ci

      - name: Typecheck
        working-directory: SAN
        run: npm run typecheck

      - name: Tests
        working-directory: SAN
        run: npm test

      - name: Build
        working-directory: SAN
        run: npm run build

      # Étape conditionnelle : n'a lieu que si le projet définit `test:e2e`.
      - name: Détecter les tests e2e
        id: e2e
        working-directory: SAN
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer le navigateur Playwright
        if: steps.e2e.outputs.present == 'true'
        working-directory: SAN
        run: npx playwright install --with-deps chromium

      - name: Tests e2e
        if: steps.e2e.outputs.present == 'true'
        working-directory: SAN
        run: npm run test:e2e
