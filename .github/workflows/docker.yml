name: Docker

# Construit et publie ghcr.io/<owner>/san et ghcr.io/<owner>/san-tts.
# Dagda vit dans un dépôt frère : la ref à cloner est lue dans DAGDA_REF.
on:
  push:
    branches: ["**"]
  # Reconstruire à la main (ex. nouveau commit côté Dagda).
  workflow_dispatch:

jobs:
  api:
    name: Image san (api)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout SAN
        uses: actions/checkout@v4
        with:
          path: SAN

      - name: Lire la ref de Dagda (DAGDA_REF)
        id: dagda-ref
        run: echo "ref=$(tr -d '[:space:]' < SAN/DAGDA_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout Dagda
        uses: actions/checkout@v4
        with:
          repository: ItHasU/dagda
          ref: ${{ steps.dagda-ref.outputs.ref }}
          path: dagda

      # Option NAS ARM : décommenter ceci et `linux/arm64` dans `platforms` plus bas.
      # - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io refuse les majuscules dans le nom d'image.
      - name: Nom d'image en minuscules
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/san" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          # Parent des deux checkouts : le Dockerfile y prend `dagda` et `SAN`.
          context: .
          file: SAN/Dockerfile
          push: true
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=san
          cache-to: type=gha,mode=max,scope=san

  tts:
    name: Image san-tts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom d'image en minuscules
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/san-tts" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: tts
          push: true
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=san-tts
          cache-to: type=gha,mode=max,scope=san-tts
