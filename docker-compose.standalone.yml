# Variante SANS reverse proxy existant : `api` publie son port directement.
# (Prévoir tout de même du TLS devant, SAN est exposé sur internet : SPEC §14.)
#
#   docker compose -f docker-compose.standalone.yml up -d
#
# Même variables que docker-compose.yml (.env). Le réseau `internal` reste sans
# accès extérieur pour db/tts ; `api` a en plus le réseau `public` pour être
# joignable (et pour atteindre l'extérieur si besoin).

services:
  api:
    image: ghcr.io/ithasu/san:${SAN_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: SAN/Dockerfile
    restart: unless-stopped
    ports:
      - "${PUBLISHED_PORT:-3000}:3000"
    environment:
      APP_PORT: "3000"
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL requis}
      APP_DATABASE_URL: postgresql://${DB_USER:-san}:${DB_PASSWORD:?DB_PASSWORD requis}@db:5432/${DB_NAME:-san}
      APP_SECRET: ${APP_SECRET:?APP_SECRET requis}
      DATA_DIR: /data
      TTS_URL: http://tts:5000
      # Aucun proxy devant : ne pas faire confiance à X-Forwarded-For.
      SAN_TRUST_PROXY: ${SAN_TRUST_PROXY:-0}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
    networks: [public, internal]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-san}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
      POSTGRES_DB: ${DB_NAME:-san}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  tts:
    image: ghcr.io/ithasu/san-tts:${SAN_IMAGE_TAG:-main}
    build: ./tts
    restart: unless-stopped
    volumes:
      - ./voices:/voices
    networks: [internal]

networks:
  public: {}
  internal:
    internal: true
